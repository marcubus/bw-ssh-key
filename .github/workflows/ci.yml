name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Format and lint
        run: mise run check

      - name: Help and version
        run: |
          ./install.sh --help >/dev/null
          ./install.sh --version

      - name: Dependency check
        run: |
          set +e
          ./install.sh --check
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 2 ]]; then
            echo "unexpected --check exit code: $rc" >&2
            exit 1
          fi
