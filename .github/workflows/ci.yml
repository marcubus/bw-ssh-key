name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Format and lint
        run: mise run check

      - name: Help and version
        run: |
          ./install.sh --help >/dev/null
          ./install.sh --version

      - name: Dependency check
        run: |
          set +e
          ./install.sh --check
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 2 ]]; then
            echo "unexpected --check exit code: $rc" >&2
            exit 1
          fi

  tag-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches SCRIPT_VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^readonly SCRIPT_VERSION="\(.*\)"$/\1/p' install.sh)
          echo "tag=$tag script_version=$version"
          if [[ -z $version ]]; then
            echo "could not read SCRIPT_VERSION from install.sh" >&2
            exit 1
          fi
          if [[ $tag != "$version" ]]; then
            echo "tag and SCRIPT_VERSION differ" >&2
            exit 1
          fi
